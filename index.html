<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер Переводчик Раскладки PRO</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: white;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e2e8f0;
            --input-bg: white;
            --btn-bg: #3182ce;
            --btn-hover: #2b6cb0;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #f7fafc;
            --text-sub: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #1a202c;
            --btn-bg: #4299e1;
            --btn-hover: #3182ce;
        }

        [data-theme="gold"] {
            --bg-color: #1c1912;
            --card-bg: #2d2613;
            --text-main: #f7e7c4;
            --text-sub: #cfa861;
            --border-color: #8c6f2d;
            --input-bg: #1c1912;
            --btn-bg: linear-gradient(135deg, #d4af37, #aa7c11);
            --btn-hover: linear-gradient(135deg, #aa7c11, #8c6f2d);
        }

        [data-theme="silver"] {
            --bg-color: #1e2229;
            --card-bg: #2d323b;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #64748b;
            --input-bg: #1e2229;
            --btn-bg: linear-gradient(135deg, #bdc3c7, #2c3e50);
            --btn-hover: linear-gradient(135deg, #95a5a6, #7f8c8d);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        .controls-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .select-styled {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            margin-top: 5px;
        }
        p.subtitle {
            color: var(--text-sub);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            padding-right: 45px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        textarea:focus {
            border-color: #4299e1;
            outline: none;
        }

        .audio-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: rgba(0, 0, 0, 0.05);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        .audio-btn:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .history-card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .history-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-history {
            font-size: 12px;
            color: #ef4444;
            cursor: pointer;
            background: none;
            border: none;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        .history-item {
            background: var(--bg-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #3182ce;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .history-item .orig { color: var(--text-sub); font-size: 12px; }
        .history-item .trans { font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls-container">
        <select class="select-styled" id="themeSelect">
            <option value="light">☀️ Светлая тема</option>
            <option value="dark">🌙 Тёмная тема</option>
            <option value="gold">👑 Золотая тема</option>
            <option value="silver">🥈 Серебряная тема</option>
        </select>
    </div>
    
    <h1>Мульти Переводчик Раскладки</h1>
    <p class="subtitle">Если ваш друг не поменял раскладку с английской на русскую — мы в помощь!</p>
    
    <div class="textarea-wrapper">
        <textarea id="input" placeholder="Вставьте сюда текст (например, ghbdtn...)"></textarea>
    </div>

    <div class="textarea-wrapper">
        <textarea id="output" placeholder="Результат появится здесь..." readonly></textarea>
        <button class="audio-btn" id="speakBtn" title="Озвучить результат">🔊</button>
    </div>

    <button class="btn" id="copyBtn">Копировать результат</button>
</div>

<div class="history-card">
    <div class="history-title">
        <span>🕒 Последние переводы</span>
        <button class="clear-history" id="clearBtn">Очистить</button>
    </div>
    <div class="history-list" id="historyList"></div>
</div>

<script>
// 1. Полная закрытая карта символов (EN -> RU)
const map = {
    'q':'й', 'w':'ц', 'e':'у', 'r':'к', 't':'е', 'y':'н', 'u':'г', 'i':'ш', 'o':'щ', 'p':'з', '[':'х', ']':'ъ',
    'a':'ф', 's':'ы', 'd':'в', 'f':'а', 'g':'п', 'h':'р', 'j':'о', 'k':'л', 'l':'д', ';':'ж', "'":'э',
    'z':'я', 'x':'ч', 'c':'с', 'v':'м', 'b':'и', 'n':'т', 'm':'ь', ',':'б', '.':'ю', '/':'.',
    'Q':'Й', 'W':'Ц', 'E':'У', 'R':'К', 'T':'Е', 'Y':'Н', 'U':'Г', 'I':'Ш', 'O':'Щ', 'P':'З', '{':'Х', '}':'Ъ',
    'A':'Ф', 'S':'Ы', 'D':'В', 'F':'А', 'G':'П', 'H':'Р', 'J':'О', 'K':'Л', 'L':'Д', ':':'Ж', '"':'Э',
    'Z':'Я', 'X':'Ч', 'C':'С', 'V':'М', 'B':'И', 'N':'Т', 'M':'Ь', '<':'Б', '>':'Ю', '?':','
};

// 2. DOM-элементы
const input = document.getElementById('input');
const output = document.getElementById('output');
const themeSelect = document.getElementById('themeSelect');
const copyBtn = document.getElementById('copyBtn');
const speakBtn = document.getElementById('speakBtn');
const clearBtn = document.getElementById('clearBtn');
const historyList = document.getElementById('historyList');

// Загрузка сохраненной истории из браузера
let history = JSON.parse(localStorage.getItem('layout_history')) || [];

// 3. Функция трансляции
function translateText(text) {
    return text.split('').map(char => map[char] || char).join('');
}

// 4. Логика перевода при вводе (на лету)
let historyTimeout;
input.addEventListener('input', () => {
    const text = input.value;
    const translated = translateText(text);
    output.value = translated;

    // Сохранение в историю, когда пользователь закончил печатать (пауза 1.5 сек)
    clearTimeout(historyTimeout);
    if (text.trim().length > 1) {
        historyTimeout = setTimeout(() => {
            addHistoryItem(text.trim(), translated.trim());
        }, 1500);
    }
});

// 5. Переключение и сохранение тем оформления
themeSelect.addEventListener('change', (e) => {
    const theme = e.target.value;
    if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
    } else {
        document.documentElement.setAttribute('data-theme', theme);
    }
    localStorage.setItem('layout_theme', theme);
});

// Загрузка темы при инициализации
const savedTheme = localStorage.getItem('layout_theme');
if (savedTheme) {
    themeSelect.value = savedTheme;
if (savedTheme !== 'light') document.documentElement.setAttribute('data-theme', savedTheme);
}
// 6. Копирование результата в буфер
copyBtn.addEventListener('click', () => {
if (!output.value) return;
navigator.clipboard.writeText(output.value).then(() => {
const originalText = copyBtn.textContent;
copyBtn.textContent = '⏱ Скопировано!';
copyBtn.style.background = '#48bb78';
setTimeout(() => {
copyBtn.textContent = originalText;
copyBtn.style.background = '';
}, 1500);
});
});
// 7. Озвучка текста (Web Speech API)
speakBtn.addEventListener('click', () => {
if (!output.value) return;
window.speechSynthesis.cancel(); // Сброс текущей речи
const utterance = new SpeechSynthesisUtterance(output.value);
utterance.lang = 'ru-RU';
window.speechSynthesis.speak(utterance);
});
// 8. Логика отображения и управления историей
function renderHistory() {
historyList.innerHTML = '';
history.forEach(item => {
const div = document.createElement('div');
div.className = 'history-item';
div.innerHTML = <span class="orig">${escapeHtml(item.orig)}</span> <span class="trans">${escapeHtml(item.trans)}</span>;
historyList.appendChild(div);
});
}
function addHistoryItem(orig, trans) {
// ИСПРАВЛЕНО: корректное обращение к первому элементу массива history[0]
if (history.length > 0 && history[0].orig === orig) return;
history.unshift({ orig, trans });
if (history.length > 10) history.pop(); // Хранить только 10 последних записей
localStorage.setItem('layout_history', JSON.stringify(history));
renderHistory();
}
clearBtn.addEventListener('click', () => {
history = [];
localStorage.removeItem('layout_history');
renderHistory();
});
// Защита от XSS при выводе текста в HTML
function escapeHtml(text) {
const map = {'&': '&', '<': '<', '>': '>', '"': '"', "'": '''};
return text.replace(/[&<>"']/g, m => map[m]);
}
// Инициализация истории при загрузке страницы
renderHistory();
