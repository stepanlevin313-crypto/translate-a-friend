<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульти Переводчик PRO</title>
    <style>
        /* Цветовые схемы для всех тем */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: white;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e2e8f0;
            --input-bg: white;
            --btn-bg: #3182ce;
            --btn-hover: #2b6cb0;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #f7fafc;
            --text-sub: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #1a202c;
            --btn-bg: #4299e1;
            --btn-hover: #3182ce;
        }

        [data-theme="gold"] {
            --bg-color: #1c1912;
            --card-bg: #2d2613;
            --text-main: #f7e7c4;
            --text-sub: #cfa861;
            --border-color: #8c6f2d;
            --input-bg: #1c1912;
            --btn-bg: linear-gradient(135deg, #d4af37, #aa7c11);
            --btn-hover: linear-gradient(135deg, #aa7c11, #8c6f2d);
        }

        [data-theme="silver"] {
            --bg-color: #1e2229;
            --card-bg: #2d323b;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #64748b;
            --input-bg: #1e2229;
            --btn-bg: linear-gradient(135deg, #bdc3c7, #2c3e50);
            --btn-hover: linear-gradient(135deg, #95a5a6, #7f8c8d);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .controls-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .select-styled {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            margin-top: 5px;
        }
        p.subtitle {
            color: var(--text-sub);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        textarea:focus {
            border-color: #4299e1;
            outline: none;
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--btn-bg);
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: var(--btn-hover);
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .status-msg {
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: -10px;
            margin-bottom: 10px;
            height: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls-container">
        <!-- Выбор режима и языков -->
        <select class="select-styled" id="modeSelect">
            <option value="layout">⌨️ Раскладка (QWERTY ⇄ ЙЦУКЕН)</option>
            <option value="en|ru">🇺🇸 Английский ➔ 🇷🇺 Русский</option>
            <option value="ru|en">🇷🇺 Русский ➔ 🇺🇸 Английский</option>
            <option value="zh|ru">🇨🇳 Китайский ➔ 🇷🇺 Русский</option>
            <option value="ru|zh">🇷🇺 Русский ➔ 🇨🇳 Китайский</option>
            <option value="de|ru">🇩🇪 Немецкий ➔ 🇷🇺 Русский</option>
            <option value="ru|de">🇷🇺 Русский ➔ 🇩🇪 Немецкий</option>
            <option value="es|ru">🇪🇸 Испанский ➔ 🇷🇺 Русский</option>
            <option value="ru|es">🇷🇺 Русский ➔ 🇪🇸 Испанский</option>
            <option value="fr|ru">🇫🇷 Французский ➔ 🇷🇺 Русский</option>
            <option value="ru|fr">🇷🇺 Русский ➔ 🇫🇷 Французский</option>
        </select>

        <!-- Выбор темы -->
        <select class="select-styled" id="themeSelect">
            <option value="light">☀️ Светлая тема</option>
            <option value="dark">🌙 Тёмная тема</option>
            <option value="gold">👑 Золотая тема</option>
            <option value="silver">🥈 Серебряная тема</option>
        </select>
    </div>
    
    <h1 id="mainTitle">Мульти Переводчик</h1>
    <p class="subtitle" id="mainSubtitle">Если ваш друг не поменял раскладку с английской на русскую — мы в помощь!</p>
    
    <textarea id="input" placeholder="Введите текст для обработки..."></textarea>
    <div class="status-msg" id="statusMessage"></div>
    <textarea id="output" placeholder="Результат появится здесь..." readonly></textarea>
    <button class="btn" onclick="copyText()">Копировать результат</button>
</div>

<script>
const map = {
    'q':'й', 'w':'ц', 'e':'у', 'r':'к', 't':'е', 'y':'н', 'u':'г', 'i':'ш', 'o':'щ', 'p':'з', '[':'х', ']':'ъ',
    'a':'ф', 's':'ы', 'd':'в', 'f':'а', 'g':'п', 'h':'р', 'j':'о', 'k':'л', 'l':'д', ';':'ж', "'":'э',
    'z':'я', 'x':'ч', 'c':'с', 'v':'м', 'b':'и', 'n':'т', 'm':'ь', ',':'б', '.':'ю', '/':'.',
    'Q':'Й', 'W':'Ц', 'E':'У', 'R':'К', 'T':'Е', 'Y':'Н', 'U':'Г', 'I':'Ш', 'O':'Щ', 'P':'З', '{':'Х', '}':'Ъ',
    'A':'Ф', 'S':'Ы', 'D':'В', 'F':'А', 'G':'П', 'H':'Р', 'J':'О', 'K':'Л', 'L':'Д', ':':'Ж', '"':'Э',
    'Z':'Я', 'X':'Ч', 'C':'С', 'V':'М', 'B':'И', 'N':'Т', 'M':'Ь', '<':'Б', '>':'Ю', '?':','
};

const input = document.getElementById('input');
const output = document.getElementById('output');
const themeSelect = document.getElementById('themeSelect');
const modeSelect = document.getElementById('modeSelect');
const mainTitle = document.getElementById('mainTitle');
const mainSubtitle = document.getElementById('mainSubtitle');
const statusMessage = document.getElementById('statusMessage');

let timeoutId = null;

const languageNames = {
    'en|ru': { title: 'Перевод слов (EN ➔ RU)', sub: 'Переводим английский текст на русский язык!', ph: 'Type English text here...' },
    'ru|en': { title: 'Перевод слов (RU ➔ EN)', sub: 'Переводим русский текст на английский язык!', ph: 'Введите текст на русском...' },
    'zh|ru': { title: 'Перевод слов (ZH ➔ RU)', sub: 'Переводим китайские иероглифы на русский язык!', ph: '输入中文...' },
    'ru|zh': { title: 'Перевод слов (RU ➔ ZH)', sub: 'Переводим русский текст на китайские иероглифы!', ph: 'Введите текст на русском...' },
    'de|ru': { title: 'Перевод слов (DE ➔ RU)', sub: 'Переводим немецкий текст на русский язык!', ph: 'Schreiben Sie auf Deutsch...' },
    'ru|de': { title: 'Перевод слов (RU ➔ DE)', sub: 'Переводим русский текст на немецкий язык!', ph: 'Введите текст на русском...' },
    'es|ru': { title: 'Перевод слов (ES ➔ RU)', sub: 'Переводим испанский текст на русский язык!', ph: 'Escribe en español...' },
    'ru|es': { title: 'Перевод слов (RU ➔ ES)', sub: 'Переводим русский текст на испанский язык!', ph: 'Введите текст на русском...' },
    'fr|ru': { title: 'Перевод слов (FR ➔ RU)', sub: 'Переводим французский текст на русский язык!', ph: 'Écrivez en français...' },
    'ru|fr': { title: 'Перевод слов (RU ➔ FR)', sub: 'Переводим русский текст на французский язык!', ph: 'Введите текст на русском...' }
};

modeSelect.addEventListener('change', () => {
    output.value = '';
    input.value = '';
    statusMessage.textContent = '';
    const mode = modeSelect.value;
    if (mode === 'layout') {
        mainTitle.textContent = 'Переводчик раскладки';
        mainSubtitle.textContent = 'Если ваш друг не поменял раскладку с английской на русскую — мы в помощь!';
        input.placeholder = 'Вставьте сюда текст (например, ghbdtn...)';
    } else if (languageNames[mode]) {
        mainTitle.textContent = languageNames[mode].title;
        mainSubtitle.textContent = languageNames[mode].sub;
        input.placeholder = languageNames[mode].ph;
    }
});

input.addEventListener('input', () => {
    const mode = modeSelect.value;
    if (mode === 'layout') {
        let text = input.value;
        let result = '';
        for (let char of text) {
            result += map[char] || char;
        }
        output.value = result;
    } else {
        clearTimeout(timeoutId);
        if (!input.value.trim()) {
            output.value = '';
Use code with caution.
statusMessage.textContent = '';
return;
}
statusMessage.textContent = 'Перевожу...';
timeoutId = setTimeout(() => {
const url = https://translated.net{encodeURIComponent(input.value)}&langpair=${mode};
fetch(url)
.then(res => res.json())
.then(data => {
output.value = data.responseData.translatedText;
statusMessage.textContent = '';
})
.catch(() => {
statusMessage.textContent = 'Ошибка сети. Попробуйте еще раз.';
});
}, 800);
}
});
function copyText() {
output.select();
document.execCommand('copy');
alert('Текст скопирован!');
}
themeSelect.addEventListener('change', (e) => {
const selectedTheme = e.target.value;
if (selectedTheme === 'light') {
document.documentElement.removeAttribute('data-theme');
} else {
document.documentElement.setAttribute('data-theme', selectedTheme);
}
});
