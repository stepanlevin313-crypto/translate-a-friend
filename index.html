<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводчик раскладки</title>
    <style>
        /* Цветовые схемы для всех тем */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: white;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e2e8f0;
            --input-bg: white;
            --btn-bg: #3182ce;
            --btn-hover: #2b6cb0;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #f7fafc;
            --text-sub: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #1a202c;
            --btn-bg: #4299e1;
            --btn-hover: #3182ce;
        }

        [data-theme="gold"] {
            --bg-color: #1c1912;
            --card-bg: #2d2613;
            --text-main: #f7e7c4;
            --text-sub: #cfa861;
            --border-color: #8c6f2d;
            --input-bg: #1c1912;
            --btn-bg: linear-gradient(135deg, #d4af37, #aa7c11);
            --btn-hover: linear-gradient(135deg, #aa7c11, #8c6f2d);
        }

        [data-theme="silver"] {
            --bg-color: #1e2229;
            --card-bg: #2d323b;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #64748b;
            --input-bg: #1e2229;
            --btn-bg: linear-gradient(135deg, #bdc3c7, #2c3e50);
            --btn-hover: linear-gradient(135deg, #95a5a6, #7f8c8d);
        }

        /* Фиолетовая тема */
        [data-theme="purple"] {
            --bg-color: #120e1a;
            --card-bg: #1f1a2e;
            --text-main: #f3ebff;
            --text-sub: #b794f4;
            --border-color: #553c9a;
            --input-bg: #120e1a;
            --btn-bg: #805ad5;
            --btn-hover: #6b46c1;
        }

        /* Неоновая фиолетовая тема */
        [data-theme="neon-purple"] {
            --bg-color: #090014;
            --card-bg: #160027;
            --text-main: #fff1ff;
            --text-sub: #d6a6ff;
            --border-color: #8b2cff;
            --input-bg: #0d0018;
            --btn-bg: #a100ff;
            --btn-hover: #d000ff;
        }

        [data-theme="neon-purple"] body {
            background-image: radial-gradient(
                circle at top,
                rgba(138, 43, 226, 0.22),
                transparent 55%
            );
        }

        [data-theme="neon-purple"] .container {
            border: 1px solid #8b2cff;
            box-shadow:
                0 0 12px rgba(161, 0, 255, 0.45),
                0 0 35px rgba(161, 0, 255, 0.2);
        }

        [data-theme="neon-purple"] h1 {
            text-shadow: 0 0 12px rgba(208, 0, 255, 0.8);
        }

        [data-theme="neon-purple"] textarea:focus {
            border-color: #d000ff;
            box-shadow: 0 0 12px rgba(208, 0, 255, 0.55);
        }

        [data-theme="neon-purple"] .btn {
            box-shadow: 0 0 14px rgba(161, 0, 255, 0.55);
        }

        [data-theme="neon-purple"] .btn:hover {
            box-shadow: 0 0 22px rgba(208, 0, 255, 0.8);
        }

        [data-theme="red"] {
            --bg-color: #1f0b0b;
            --card-bg: #361414;
            --text-main: #ffebeb;
            --text-sub: #feb2b2;
            --border-color: #9b2c2c;
            --input-bg: #1f0b0b;
            --btn-bg: #e53e3e;
            --btn-hover: #c53030;
        }

        [data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-main: #edf2f7;
            --text-sub: #64dfdf;
            --border-color: #3a506b;
            --input-bg: #0b132b;
            --btn-bg: #00b4d8;
            --btn-hover: #0077b6;
        }

        [data-theme="orange"] {
            --bg-color: #1f140a;
            --card-bg: #332212;
            --text-main: #fff5eb;
            --text-sub: #fbd38d;
            --border-color: #dd6b20;
            --input-bg: #1f140a;
            --btn-bg: #ed8936;
            --btn-hover: #dd6b20;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Стили для выбора тем */
        .theme-select-container {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .theme-select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            margin-top: 15px;
        }

        p.subtitle {
            color: var(--text-sub);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--btn-bg);
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-bottom: 20px;
        }

        .btn:hover {
            background: var(--btn-hover);
            opacity: 0.9;
        }

        /* Московские часы */
        .clock-box {
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 5px;
        }

        .clock-time {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .clock-date {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="theme-select-container">
        <select class="theme-select" id="themeSelect">
            <option value="light">☀️ Светлая</option>
            <option value="dark">🌙 Тёмная</option>
            <option value="gold">👑 Золотая</option>
            <option value="silver">🥈 Серебряная</option>
            <option value="purple">🔮 Фиолетовая</option>
            <option value="neon-purple">💜 Неоновая фиолетовая</option>
            <option value="red">❤️ Красная</option>
            <option value="blue">💙 Синяя</option>
            <option value="orange">🍊 Оранжевая</option>
        </select>
    </div>

    <h1>Переводчик раскладки (QWERTY ⇄ ЙЦУКЕН)</h1>
    <p class="subtitle">Если ваш friend не поменял раскладку с английской на русскую — мы в помощь!</p>

    <textarea id="input" placeholder="Вставьте сюда текст (например, ghbdtn...)"></textarea>
    <textarea id="output" placeholder="Результат появится здесь..." readonly></textarea>
    <button class="btn" onclick="copyText()">Копировать результат</button>

    <!-- Блок с часами по МСК -->
    <div class="clock-box">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate">Время по МСК</div>
    </div>
</div>

<script>
    const map = {
        'q': 'й', 'w': 'ц', 'e': 'у', 'r': 'к', 't': 'е', 'y': 'н', 'u': 'г', 'i': 'ш', 'o': 'щ', 'p': 'з', '[': 'х', ']': 'ъ',
        'a': 'ф', 's': 'ы', 'd': 'в', 'f': 'а', 'g': 'п', 'h': 'р', 'j': 'о', 'k': 'л', 'l': 'д', ';': 'ж', "'": 'э',
        'z': 'я', 'x': 'ч', 'c': 'с', 'v': 'м', 'b': 'и', 'n': 'т', 'm': 'ь', ',': 'б', '.': 'ю', '/': '.',
        'Q': 'Й', 'W': 'Ц', 'E': 'У', 'R': 'К', 'T': 'Е', 'Y': 'Н', 'U': 'Г', 'I': 'Ш', 'O': 'Щ', 'P': 'З', '{': 'Х', '}': 'Ъ',
        'A': 'Ф', 'S': 'Ы', 'D': 'В', 'F': 'А', 'G': 'П', 'H': 'Р', 'J': 'О', 'K': 'Л', 'L': 'Д', ':': 'Ж', '"': 'Э',
        'Z': 'Я', 'X': 'Ч', 'C': 'С', 'V': 'М', 'B': 'И', 'N': 'Т', 'M': 'Ь', '<': 'Б', '>': 'Ю', '?': ','
    };

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const themeSelect = document.getElementById('themeSelect');

    // Логика перевода раскладки
    input.addEventListener('input', () => {
        let text = input.value;
        let result = '';

        for (let char of text) {
            result += map[char] || char;
        }

        output.value = result;
    });

    // Логика копирования
    function copyText() {
        if (!output.value) return;

        output.select();
        document.execCommand('copy');
        alert('Текст скопирован!');
    }

    // Логика переключения тем через выпадающее меню
    themeSelect.addEventListener('change', (e) => {
        const selectedTheme = e.target.value;

        if (selectedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', selectedTheme);
        }
    });

    // Логика московских часов
    function updateMskClock() {
        const clockTime = document.getElementById('clockTime');
        const clockDate = document.getElementById('clockDate');
        const now = new Date();

        const timeString = now.toLocaleTimeString('ru-RU', {
            timeZone: 'Europe/Moscow',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });

        clockTime.textContent = timeString;

        const dateOptions = {
            timeZone: 'Europe/Moscow',
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        };

        let dateString = now.toLocaleDateString('ru-RU', dateOptions);
        dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1) + ' (МСК)';
        clockDate.textContent = dateString;
    }

    setInterval(updateMskClock, 1000);
    updateMskClock();
</script>

</body>
</html>
