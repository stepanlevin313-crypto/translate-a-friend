<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводчики</title>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: white;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #e2e8f0;
            --input-bg: white;
            --btn-bg: #3182ce;
            --btn-hover: #2b6cb0;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-main: #f7fafc;
            --text-sub: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #1a202c;
            --btn-bg: #4299e1;
            --btn-hover: #3182ce;
        }

        [data-theme="gold"] {
            --bg-color: #1c1912;
            --card-bg: #2d2613;
            --text-main: #f7e7c4;
            --text-sub: #cfa861;
            --border-color: #8c6f2d;
            --input-bg: #1c1912;
            --btn-bg: linear-gradient(135deg, #d4af37, #aa7c11);
            --btn-hover: linear-gradient(135deg, #aa7c11, #8c6f2d);
        }

        [data-theme="silver"] {
            --bg-color: #1e2229;
            --card-bg: #2d323b;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border-color: #64748b;
            --input-bg: #1e2229;
            --btn-bg: linear-gradient(135deg, #bdc3c7, #2c3e50);
            --btn-hover: linear-gradient(135deg, #95a5a6, #7f8c8d);
        }

        [data-theme="purple"] {
            --bg-color: #120e1a;
            --card-bg: #1f1a2e;
            --text-main: #f3ebff;
            --text-sub: #b794f4;
            --border-color: #553c9a;
            --input-bg: #120e1a;
            --btn-bg: #805ad5;
            --btn-hover: #6b46c1;
        }

        [data-theme="neon-purple"] {
            --bg-color: #090014;
            --card-bg: #160027;
            --text-main: #fff1ff;
            --text-sub: #d6a6ff;
            --border-color: #8b2cff;
            --input-bg: #0d0018;
            --btn-bg: #a100ff;
            --btn-hover: #d000ff;
        }

        [data-theme="neon-purple"] body {
            background-image: radial-gradient(
                circle at top,
                rgba(138, 43, 226, 0.22),
                transparent 55%
            );
        }

        [data-theme="neon-purple"] .container {
            border: 1px solid #8b2cff;
            box-shadow:
                0 0 12px rgba(161, 0, 255, 0.45),
                0 0 35px rgba(161, 0, 255, 0.2);
        }

        [data-theme="neon-purple"] h1 {
            text-shadow: 0 0 12px rgba(208, 0, 255, 0.8);
        }

        [data-theme="neon-purple"] textarea:focus {
            border-color: #d000ff;
            box-shadow: 0 0 12px rgba(208, 0, 255, 0.55);
        }

        [data-theme="neon-purple"] .btn {
            box-shadow: 0 0 14px rgba(161, 0, 255, 0.55);
        }

        [data-theme="neon-purple"] .btn:hover {
            box-shadow: 0 0 22px rgba(208, 0, 255, 0.8);
        }

        [data-theme="red"] {
            --bg-color: #1f0b0b;
            --card-bg: #361414;
            --text-main: #ffebeb;
            --text-sub: #feb2b2;
            --border-color: #9b2c2c;
            --input-bg: #1f0b0b;
            --btn-bg: #e53e3e;
            --btn-hover: #c53030;
        }

        [data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-main: #edf2f7;
            --text-sub: #64dfdf;
            --border-color: #3a506b;
            --input-bg: #0b132b;
            --btn-bg: #00b4d8;
            --btn-hover: #0077b6;
        }

        [data-theme="orange"] {
            --bg-color: #1f140a;
            --card-bg: #332212;
            --text-main: #fff5eb;
            --text-sub: #fbd38d;
            --border-color: #dd6b20;
            --input-bg: #1f140a;
            --btn-bg: #ed8936;
            --btn-hover: #dd6b20;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .theme-select-container {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .theme-select,
        .translation-controls select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 40px 0 5px;
        }

        h2.section-title {
            font-size: 18px;
            margin: 24px 0 12px;
        }

        p.subtitle {
            color: var(--text-sub);
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--btn-bg);
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-bottom: 12px;
        }

        .btn:hover {
            background: var(--btn-hover);
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .translation-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .translation-controls select {
            flex: 1;
            min-width: 0;
            font-size: 15px;
        }

        .swap-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        .translate-status {
            min-height: 20px;
            margin: -5px 0 12px;
            color: var(--text-sub);
            font-size: 13px;
        }

        .clock-box {
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 5px;
        }

        .clock-time {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .clock-date {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .translation-controls {
                gap: 6px;
            }

            .translation-controls select {
                font-size: 13px;
                padding: 8px 5px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="theme-select-container">
        <select class="theme-select" id="themeSelect" aria-label="Выбрать тему">
            <option value="light">☀️ Светлая</option>
            <option value="dark">🌙 Тёмная</option>
            <option value="gold">👑 Золотая</option>
            <option value="silver">🥈 Серебряная</option>
            <option value="purple">🔮 Фиолетовая</option>
            <option value="neon-purple">💜 Неоновая фиолетовая</option>
            <option value="red">❤️ Красная</option>
            <option value="blue">💙 Синяя</option>
            <option value="orange">🍊 Оранжевая</option>
        </select>
    </div>

    <h1>Переводчики</h1>
    <p class="subtitle">
        Перевод текста между языками и исправление неправильно выбранной раскладки
    </p>

    <!-- Обычный переводчик -->
    <h2 class="section-title">Обычный переводчик</h2>

    <div class="translation-controls">
        <select id="sourceLanguage" aria-label="Язык исходного текста">
            <option value="ru" selected>Русский</option>
            <option value="en">Английский</option>
            <option value="zh-CN">Китайский</option>
            <option value="de">Немецкий</option>
            <option value="fr">Французский</option>
            <option value="es">Испанский</option>
            <option value="it">Итальянский</option>
            <option value="ja">Японский</option>
            <option value="ko">Корейский</option>
            <option value="tr">Турецкий</option>
        </select>

        <button
            type="button"
            class="swap-btn"
            id="swapLanguages"
            aria-label="Поменять языки местами"
            title="Поменять языки местами"
        >⇄</button>

        <select id="targetLanguage" aria-label="Язык перевода">
            <option value="ru">Русский</option>
            <option value="en" selected>Английский</option>
            <option value="zh-CN">Китайский</option>
            <option value="de">Немецкий</option>
            <option value="fr">Французский</option>
            <option value="es">Испанский</option>
            <option value="it">Итальянский</option>
            <option value="ja">Японский</option>
            <option value="ko">Корейский</option>
            <option value="tr">Турецкий</option>
        </select>
    </div>

    <textarea
        id="translateInput"
        placeholder="Введите текст для перевода..."
    ></textarea>

    <button class="btn" id="translateButton" type="button">
        Перевести
    </button>

    <p class="translate-status" id="translateStatus" aria-live="polite"></p>

    <textarea
        id="translateOutput"
        placeholder="Здесь появится перевод..."
        readonly
    ></textarea>

    <button class="btn" id="copyTranslationButton" type="button">
        Копировать перевод
    </button>

    <button class="btn" id="speakTranslationButton" type="button">
        🔊 Прослушать перевод
    </button>

    <button class="btn" id="stopSpeakingButton" type="button">
        ⏹ Остановить озвучивание
    </button>

    <!-- Переводчик раскладки -->
    <h2 class="section-title">Переводчик раскладки (QWERTY → ЙЦУКЕН)</h2>

    <textarea
        id="input"
        placeholder="Вставьте текст с неправильной раскладкой, например ghbdtn..."
    ></textarea>

    <textarea
        id="output"
        placeholder="Результат появится здесь..."
        readonly
    ></textarea>

    <button class="btn" id="copyLayoutButton" type="button">
        Копировать результат
    </button>

    <!-- Часы по Москве -->
    <div class="clock-box">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate">Время по МСК</div>
    </div>
</div>

<script>
    // Таблица соответствия английской и русской раскладок
    const map = {
        'q': 'й', 'w': 'ц', 'e': 'у', 'r': 'к', 't': 'е', 'y': 'н',
        'u': 'г', 'i': 'ш', 'o': 'щ', 'p': 'з', '[': 'х', ']': 'ъ',
        'a': 'ф', 's': 'ы', 'd': 'в', 'f': 'а', 'g': 'п', 'h': 'р',
        'j': 'о', 'k': 'л', 'l': 'д', ';': 'ж', "'": 'э',
        'z': 'я', 'x': 'ч', 'c': 'с', 'v': 'м', 'b': 'и', 'n': 'т',
        'm': 'ь', ',': 'б', '.': 'ю', '/': '.',

        'Q': 'Й', 'W': 'Ц', 'E': 'У', 'R': 'К', 'T': 'Е', 'Y': 'Н',
        'U': 'Г', 'I': 'Ш', 'O': 'Щ', 'P': 'З', '{': 'Х', '}': 'Ъ',
        'A': 'Ф', 'S': 'Ы', 'D': 'В', 'F': 'А', 'G': 'П', 'H': 'Р',
        'J': 'О', 'K': 'Л', 'L': 'Д', ':': 'Ж', '"': 'Э',
        'Z': 'Я', 'X': 'Ч', 'C': 'С', 'V': 'М', 'B': 'И', 'N': 'Т',
        'M': 'Ь', '<': 'Б', '>': 'Ю', '?': ','
    };

    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const themeSelect = document.getElementById('themeSelect');

    // Автоматический перевод раскладки при вводе
    input.addEventListener('input', () => {
        let result = '';

        for (const char of input.value) {
            result += map[char] || char;
        }

        output.value = result;
    });

    // Копирование текста
    async function copyToClipboard(text) {
        if (!text) return false;

        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch {
            return false;
        }
    }

    document.getElementById('copyLayoutButton').addEventListener('click', async () => {
        if (!output.value) return;

        const copied = await copyToClipboard(output.value);

        if (copied) {
            alert('Текст скопирован!');
        } else {
            output.select();
            document.execCommand('copy');
            alert('Текст скопирован!');
        }
    });

    // Переключение цветовых тем
    themeSelect.addEventListener('change', (event) => {
        const selectedTheme = event.target.value;

        if (selectedTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', selectedTheme);
        }
    });

    // Элементы обычного переводчика
    const translateInput = document.getElementById('translateInput');
    const translateOutput = document.getElementById('translateOutput');
    const sourceLanguage = document.getElementById('sourceLanguage');
    const targetLanguage = document.getElementById('targetLanguage');
    const translateButton = document.getElementById('translateButton');
    const translateStatus = document.getElementById('translateStatus');

    // Перевод текста через онлайн-сервис
    translateButton.addEventListener('click', translateText);

    async function translateText() {
        const text = translateInput.value.trim();

        if (!text) {
            translateStatus.textContent = 'Сначала введите текст для перевода.';
            return;
        }

        if (sourceLanguage.value === targetLanguage.value) {
            translateOutput.value = text;
            translateStatus.textContent = 'Выбраны одинаковые языки.';
            return;
        }

        translateButton.disabled = true;
        translateStatus.textContent = 'Переводим…';

        try {
            const langPair =
                `${sourceLanguage.value}|${targetLanguage.value}`;

            const url =
                'https://api.mymemory.translated.net/get' +
                `?q=${encodeURIComponent(text)}` +
                `&langpair=${encodeURIComponent(langPair)}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('Сервис перевода временно недоступен.');
            }

            const data = await response.json();

            if (
                Number(data.responseStatus) !== 200 ||
                !data.responseData ||
                !data.responseData.translatedText
            ) {
                throw new Error(
                    data.responseDetails || 'Не удалось перевести текст.'
                );
            }

            translateOutput.value = data.responseData.translatedText;
            translateStatus.textContent = 'Перевод готов.';
        } catch (error) {
            translateStatus.textContent =
                error.message ||
                'Ошибка перевода. Проверьте подключение к интернету.';
        } finally {
            translateButton.disabled = false;
        }
    }

    // Поменять языки и тексты местами
    document.getElementById('swapLanguages').addEventListener('click', () => {
        const oldSourceLanguage = sourceLanguage.value;
        sourceLanguage.value = targetLanguage.value;
        targetLanguage.value = oldSourceLanguage;

        const oldText = translateInput.value;
        translateInput.value = translateOutput.value;
        translateOutput.value = oldText;

        translateStatus.textContent = '';
    });

    // Копирование обычного перевода
    document.getElementById('copyTranslationButton').addEventListener('click', async () => {
        if (!translateOutput.value) {
            translateStatus.textContent = 'Сначала переведите текст.';
            return;
        }

        const copied = await copyToClipboard(translateOutput.value);

        if (copied) {
            translateStatus.textContent = 'Перевод скопирован.';
        } else {
            translateOutput.select();
            document.execCommand('copy');
            translateStatus.textContent = 'Перевод скопирован.';
        }
    });

    // Озвучивание перевода
    document.getElementById('speakTranslationButton').addEventListener('click', () => {
        const text = translateOutput.value.trim();

        if (!text) {
            translateStatus.textContent = 'Сначала переведите текст.';
            return;
        }

        if (!('speechSynthesis' in window)) {
            translateStatus.textContent =
                'Озвучивание не поддерживается этим браузером.';
            return;
        }

        // Остановить предыдущую речь, если она ещё звучит
        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        // Язык озвучивания соответствует выбранному языку перевода
        speech.lang = targetLanguage.value;

        speech.onstart = () => {
            translateStatus.textContent = 'Озвучиваем перевод…';
        };

        speech.onend = () => {
            translateStatus.textContent = 'Озвучивание завершено.';
        };

        speech.onerror = () => {
            translateStatus.textContent =
                'Не удалось озвучить текст. Возможно, для этого языка нет голоса.';
        };

        window.speechSynthesis.speak(speech);
    });

    // Остановка озвучивания
    document.getElementById('stopSpeakingButton').addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            translateStatus.textContent = 'Озвучивание остановлено.';
        }
    });

    // Часы по Москве
    function updateMskClock() {
        const clockTime = document.getElementById('clockTime');
        const clockDate = document.getElementById('clockDate');
        const now = new Date();

        clockTime.textContent = now.toLocaleTimeString('ru-RU', {
            timeZone: 'Europe/Moscow',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });

        let dateString = now.toLocaleDateString('ru-RU', {
            timeZone: 'Europe/Moscow',
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        });

        dateString =
            dateString.charAt(0).toUpperCase() +
            dateString.slice(1) +
            ' (МСК)';

        clockDate.textContent = dateString;
    }

    setInterval(updateMskClock, 1000);
    updateMskClock();
</script>
</body>
</html>
